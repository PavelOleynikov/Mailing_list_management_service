<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Сервис управления рассылками Skymail</h5>
    <nav class="ms-5 me-auto">
        {% if user.is_authenticated %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'main:base' %}">Главная</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'recipients:recipients' %}">Получатели</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'mailing:mailing' %}">Рассылки</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'mailing:mailing_attempts_list' %}">Статус рассылок</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'message:message' %}">Сообщения</a>
        <form method="post" action="{% url 'users:logout' %}" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="p-2 btn btn-outline-primary">Выйти</button>
        </form>
        {% else %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:login' %}">Войти</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:register' %}">Регистрация</a>
        {% endif %}
    </nav>
    {% if user.is_authenticated %}
    <div class="ms-auto">
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:profile' %}">Профиль</a>
    </div>
    {% endif %}
</div>
